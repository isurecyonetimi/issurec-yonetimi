<!doctype html><html lang="tr"><meta charset="utf-8"><title>Şifre testleri</title>
<main id="app"></main><pre id="results">RUNNING</pre>
<script src="../community.js"></script><script src="../employee.js"></script><script src="../account.js"></script><script src="../app.js"></script>
<script>
(async () => {
  const before = localStorage.getItem(PASSWORD_STORAGE_KEY);
  const results = [];
  const errors = [];
  window.addEventListener('error', (e) => errors.push(e.message));
  function assert(value, message = 'Beklenti karşılanmadı') { if (!value) throw Error(message); }
  async function check(name, run) { try { await run(); results.push('PASS: ' + name); } catch (e) { results.push('FAIL: ' + name + ': ' + e.message); } }
  async function rejected(run, text) { let error; try { await run(); } catch (e) { error = e; } assert(error && error.message.includes(text), 'Beklenen hata: ' + text); }
  async function waitFor(test) { for (let i = 0; i < 2000; i++) { if (test()) return; await new Promise(resolve => setTimeout(resolve, 10)); } throw Error('İşlem zaman aşımı'); }
  async function login(index, password) {
    renderLogin(); const form = document.querySelector('#login-form');
    form.elements.email.value = users[index].email; form.elements.password.value = password;
    form.requestSubmit(); await waitFor(() => !form.querySelector('button').disabled);
  }
  try {
    localStorage.removeItem(PASSWORD_STORAGE_KEY);
    await check('Oturumsuz şifre değiştirilemez', async () => {
      renderLogin(); await rejected(() => changeOwnPassword('1234', 'YeniSifre2026', 'YeniSifre2026'), 'giriş yapın');
    });
    await check('Personelin yönetim panelinde kendi şifre formu var', async () => {
      await login(1, '1234'); assert(currentUser.email === users[1].email); assert(document.querySelector('#password-form'));
      assert(!document.querySelector('#password-form select')); assert(!currentUser.password);
    });
    await check('Yanlış mevcut şifre, kısa şifre ve tekrar uyuşmazlığı reddedilir', async () => {
      await rejected(() => changeOwnPassword('yanlış', 'YeniSifre2026', 'YeniSifre2026'), 'yanlış');
      await rejected(() => changeOwnPassword('1234', 'kısa', 'kısa'), '8–128');
      await rejected(() => changeOwnPassword('1234', 'YeniSifre2026', 'FarkliSifre'), 'eşleşmiyor');
      assert(localStorage.getItem(PASSWORD_STORAGE_KEY) === null);
    });
    await check('Form şifreyi özet olarak kaydeder ve alanları temizler', async () => {
      const form = document.querySelector('#password-form');
      form.elements.currentPassword.value = '1234'; form.elements.newPassword.value = 'YeniSifre2026'; form.elements.repeatPassword.value = 'YeniSifre2026';
      form.requestSubmit(); await waitFor(() => !form.querySelector('button').disabled);
      assert(document.querySelector('#password-status').textContent.includes('✓'));
      assert(form.elements.newPassword.value === ''); assert(currentUser.email === users[1].email);
      const raw = localStorage.getItem(PASSWORD_STORAGE_KEY); assert(!raw.includes('YeniSifre2026'));
      const records = JSON.parse(raw); assert(Object.keys(records).length === 1); assert(records[users[1].email].salt.length === 32);
    });
    await check('Çıkış sonrası eski şifre reddedilir; yeni şifre kabul edilir', async () => {
      await login(1, '1234'); assert(currentUser === null);
      await login(1, 'YeniSifre2026'); assert(currentUser.email === users[1].email);
      await rejected(() => changeOwnPassword('YeniSifre2026', 'YeniSifre2026', 'YeniSifre2026'), 'farklı');
    });
    await check('Diğer personel ve yönetici şifreleri değişmez', async () => {
      await login(2, '1234'); assert(currentUser.email === users[2].email);
      await login(0, '1234'); assert(isAdminUser()); assert(document.querySelector('#password-form'));
    });
    await check('Depolama başarısızlığında başarı mesajı verilmez', async () => {
      const original = Storage.prototype.setItem;
      Storage.prototype.setItem = function(key, value) { if (key === PASSWORD_STORAGE_KEY) throw Error('Quota'); return original.call(this, key, value); };
      try { await rejected(() => changeOwnPassword('1234', 'Yonetici2026', 'Yonetici2026'), 'kaydedilemedi'); }
      finally { Storage.prototype.setItem = original; }
      assert(await verifyAccountPassword(users[0], '1234'));
    });
    await check('Bozuk kayıt eski demo şifresine geri dönmez', async () => {
      const valid = localStorage.getItem(PASSWORD_STORAGE_KEY);
      localStorage.setItem(PASSWORD_STORAGE_KEY, '{');
      await login(1, '1234'); assert(currentUser === null);
      localStorage.setItem(PASSWORD_STORAGE_KEY, valid);
    });
    await check('Çalışma zamanı hatası yok', () => assert(errors.length === 0, errors.join('; ')));
  } finally {
    if (before === null) localStorage.removeItem(PASSWORD_STORAGE_KEY); else localStorage.setItem(PASSWORD_STORAGE_KEY, before);
    document.querySelector('#results').textContent = results.join('\n');
    document.title = results.some(r => r.startsWith('FAIL')) ? 'FAIL' : 'PASS';
  }
})();
</script></html>
